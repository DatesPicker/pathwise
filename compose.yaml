services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: pathwise
      POSTGRES_DB: pathwise
      POSTGRES_PASSWORD: ${PATHWISE_POSTGRES_PASSWORD:?PATHWISE_POSTGRES_PASSWORD must be set}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

volumes:
  postgres_data:
