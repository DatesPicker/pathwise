[project]
name = "pathwise-backend"
version = "0.1.0"
description = "Pathwise backend application"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi",
    "pydantic-settings",
    "uvicorn",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pathwise"
