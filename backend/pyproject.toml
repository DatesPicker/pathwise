[project]
name = "pathwise-backend"
version = "0.1.0"
description = "Pathwise backend application"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi",
    "pydantic-settings",
    "uvicorn",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pathwise"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.8",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
files = ["src/pathwise"]
warn_unused_configs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
